modelRoles:
  default: deepseek/deepseek-flash
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: kanso-ink-obsidian
setupVersion: 2

tools:
  approvalMode: yolo
  approval:
    # eval 能绕过 bash.patterns 再启动 shell，直接禁掉最省心
    eval: deny

bash:
  # 不自动把 && 组成的复合命令当成已批准
  allowCompoundCommands: false

  patterns:
    # ── 绝对不应该自动执行 ──
    - match: "rm -rf /"
      approval: deny
    - match: "rm -rf /*"
      approval: deny

    - match: "mkfs*"
      approval: deny
    - match: "wipefs *"
      approval: deny

    - match: "curl *|*sh*"
      approval: deny
    - match: "curl *|*bash*"
      approval: deny
    - match: "wget *|*sh*"
      approval: deny
    - match: "wget *|*bash*"
      approval: deny

    # ── 真正重要的操作才问你 ──
    - match: "sudo *"
      approval: prompt

    - match: "rm -rf *"
      approval: prompt

    - match: "dd *"
      approval: prompt

    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean *"
      approval: prompt
    - match: "git push --force*"
      approval: prompt

    - match: "reboot*"
      approval: prompt
    - match: "poweroff*"
      approval: prompt
    - match: "shutdown*"
      approval: prompt
