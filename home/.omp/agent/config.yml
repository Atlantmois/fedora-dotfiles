modelRoles:
  default: deepseek/deepseek-flash
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: kanso-ink-obsidian
setupVersion: 2
tools:
  format: auto
  approvalMode: write
  approval:
    read: allow
    edit: allow
    bash: prompt
    eval: prompt
  intentTracing: true
bash:
  allowCompoundCommands: false
  patterns:
    - match: "rm -rf *"
      approval: deny
    - match: "rm -r *"
      approval: deny
    - match: "mkfs*"
      approval: deny
    - match: "wipefs *"
      approval: deny
    - match: "dd *"
      approval: deny
    - match: "git reset --hard*"
      approval: deny
    - match: "git clean *"
      approval: deny
    - match: "git push *--force*"
      approval: deny
    - match: "git push *-f*"
      approval: deny
    - match: "sudo *"
      approval: prompt
    - match: "su *"
      approval: prompt
    - match: "curl *"
      approval: prompt
    - match: "wget *"
      approval: prompt
    - match: "ssh *"
      approval: prompt
    - match: "scp *"
      approval: prompt
    - match: "rsync *"
      approval: prompt
    - match: "git add *"
      approval: prompt
    - match: "git commit *"
      approval: prompt
    - match: "git push *"
      approval: prompt
    - match: "git pull *"
      approval: prompt
    - match: "git merge *"
      approval: prompt
    - match: "git rebase *"
      approval: prompt
    - match: "git checkout *"
      approval: prompt
    - match: "git switch *"
      approval: prompt
    - match: "git restore *"
      approval: prompt
    - match: "pwd"
      approval: allow
    - match: "ls*"
      approval: allow
    - match: "tree*"
      approval: allow
    - match: "cat *"
      approval: allow
    - match: "head *"
      approval: allow
    - match: "tail *"
      approval: allow
    - match: "less *"
      approval: allow
    - match: "file *"
      approval: allow
    - match: "stat *"
      approval: allow
    - match: "which *"
      approval: allow
    - match: "type *"
      approval: allow
    - match: "command -v *"
      approval: allow
    - match: "rg *"
      approval: allow
    - match: "grep *"
      approval: allow
    - match: "fd *"
      approval: allow
    - match: "find *"
      approval: allow
    - match: "git status*"
      approval: allow
    - match: "git diff*"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "git branch*"
      approval: allow
    - match: "git remote -v*"
      approval: allow
    - match: "*"
      approval: prompt
