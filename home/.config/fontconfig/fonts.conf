<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>Adwaita Sans</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>ja</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>ko</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>zh-tw</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>zh-hk</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>zh-mo</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>cmn</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>hak</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>lzh</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>nan</string></test>
    <test name="lang" qual="all" compare="not_contains"><string>yue</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>鸿蒙黑体</string>
    </edit>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer><family>鸿蒙黑体</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>鸿蒙黑体</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
