# Kanso Ink Obsidian — Yazi 26.9.1 user theme.

[mgr]
border_style = { fg = "#4D535C" }
marker_selected = { fg = "#96A6B3", bg = "#96A6B3" }
count_selected = { fg = "#14171D", bg = "#96A6B3" }

[indicator]
current = { fg = "#14171D", bg = "#96A6B3" }

[tabs]
active = { fg = "#14171D", bg = "#8293A3", bold = true }
inactive = { fg = "#8F969D", bg = "#1B1E23" }

[mode]
normal_main = { fg = "#14171D", bg = "#8293A3", bold = true }
normal_alt = { fg = "#8293A3", bg = "#1B1E23" }
select_main = { fg = "#14171D", bg = "#948A95", bold = true }
select_alt = { fg = "#948A95", bg = "#1B1E23" }
unset_main = { fg = "#14171D", bg = "#B78383", bold = true }
unset_alt = { fg = "#B78383", bg = "#1B1E23" }

[status]
overall = { fg = "#8F969D" }
perm_sep = { fg = "#626872" }
perm_type = { fg = "#96A6B3" }
perm_read = { fg = "#8F969D" }
perm_write = { fg = "#B78383" }
perm_exec = { fg = "#879A89" }
progress_label = { fg = "#C5C9C7" }
progress_normal = { fg = "#879A89", bg = "#4D535C" }
progress_error = { fg = "#14171D", bg = "#B78383" }

[filetype]
rules = [
  { url = "*", is = "orphan", fg = "#B78383" },
  { url = "*", is = "link", fg = "#7E9292" },
  { mime = "**/image/*", fg = "#948A95" },
  { mime = "**/audio/*", fg = "#7E9292" },
  { mime = "**/video/*", fg = "#8293A3" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8F8B78" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#8F969D" },
  { mime = "vfs/{absent,stale}", fg = "#626872" },
  { url = "*", is = "exec", fg = "#879A89" },
  { url = "*", is = "dummy", bg = "#B78383" },
  { url = "*/", is = "dummy", bg = "#B78383" },
  { url = "*/", fg = "#8293A3" },
]

